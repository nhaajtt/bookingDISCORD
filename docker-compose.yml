x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  bot:
    build: .
    image: thauxbooking:local
    container_name: thauxbooking
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    # Uncomment with WEB_PORT=8080 in .env to reach the payOS webhook and the dashboard (put a reverse proxy with https in front)
    # ports:
    #   - "127.0.0.1:8080:8080"
