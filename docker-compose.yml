x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  bot:
    build: .
    image: thauxbooking:local
    container_name: thauxbooking
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    # With WEB_PORT=8080 in .env the web server (public booking API, payOS webhook, dashboard) listens here, on this machine only.
    # Put https in front of it (Tailscale Funnel or a reverse proxy); see docs/web.md. With WEB_PORT unset nothing listens.
    ports:
      - "127.0.0.1:8080:8080"
